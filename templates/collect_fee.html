{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="fw-bold">
        <i class="bi bi-wallet2"></i>
        Collect Student Fee
    </h2>


    <a href="/fees" class="btn btn-secondary">
        Back
    </a>

</div>





<div class="card shadow p-4">


<form method="POST">


<label class="fw-bold">
    Search Student
</label>

<input
    type="text"
    id="studentSearch"
    class="form-control mb-2"
    placeholder="Search by name or roll number..."
    autocomplete="off"
>

<label class="fw-bold">
    Student Name
</label>

<select
    name="student_id"
    id="studentSelect"
    class="form-control mb-3"
    required
>

    <option value="">
        Select Student
    </option>

    {% for s in students %}

    <option
        value="{{ s.id }}"
        data-search="{{ s.roll_no }} {{ s.name|lower }}"
    >
        {{ s.roll_no }} - {{ s.name }}
    </option>

    {% endfor %}

</select>



<option value="">
Select Student
</option>


{% for s in students %}


<option value="{{ s.id }}">

{{ s.roll_no }} - {{ s.name }}

</option>


{% endfor %}


</select>





<label class="fw-bold">
Total Fee
</label>


<input 
type="number"
name="total_fee"
class="form-control mb-3"
placeholder="Enter Total Course Fee"
required
>





<label class="fw-bold">
Paid Amount
</label>


<input 
type="number"
name="paid_fee"
class="form-control mb-3"
placeholder="Enter Paid Amount"
required
>





<label class="fw-bold">
Payment Date
</label>


<input 
type="date"
name="date"
class="form-control mb-3"
required
>




<button class="btn btn-success w-100">

<i class="bi bi-check-circle"></i>

Save Fee

</button>


</form>


</div>
<script>

const searchInput = document.getElementById("studentSearch");
const studentSelect = document.getElementById("studentSelect");

searchInput.addEventListener("input", function () {

    const searchValue = this.value.toLowerCase().trim();

    const options = studentSelect.querySelectorAll("option");

    options.forEach(function (option, index) {

        if (index === 0) {
            option.style.display = "";
            return;
        }

        const searchText =
            option.getAttribute("data-search").toLowerCase();

        if (searchText.includes(searchValue)) {
            option.style.display = "";
        } else {
            option.style.display = "none";
        }

    });

});

</script>

{% endblock %}
