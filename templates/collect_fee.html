{% extends "base.html" %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="fw-bold">
        <i class="bi bi-wallet2"></i>
        Collect Student Fee
    </h2>

    <a href="/fees" class="btn btn-secondary">
        Back
    </a>

</div>


<div class="card shadow p-4">

<form method="POST">


   <!-- Search Student -->

        <div class="mb-3">

            <label class="fw-bold mb-2">
                Search Student
            </label>

            <input
                type="text"
                id="studentSearch"
                class="form-control"
                placeholder="Search by name or roll number..."
                autocomplete="off"
            >

        </div>


        <!-- Select Student -->

        <div class="mb-3">

            <label class="fw-bold mb-2">
                Select Student
            </label>

            <select
                name="student_id"
                id="studentSelect"
                class="form-control"
                required
            >

                <option value="">
                    Select Student
                </option>

                {% for s in students %}

                <option
                    value="{{ s.id }}"
                    data-search="{{ s.roll_no }} {{ s.name|lower }}"
                >
                    {{ s.roll_no }} - {{ s.name }}
                </option>

                {% endfor %}

            </select>

        </div>

    <!-- TOTAL FEE -->

    <label class="fw-bold">
        Total Fee
    </label>

    <input
        type="number"
        name="total_fee"
        class="form-control mb-3"
        placeholder="Enter Total Course Fee"
        required
    >


    <!-- PAID AMOUNT -->

    <label class="fw-bold">
        Paid Amount
    </label>

    <input
        type="number"
        name="paid_fee"
        class="form-control mb-3"
        placeholder="Enter Paid Amount"
        required
    >


    <!-- PAYMENT DATE -->

    <label class="fw-bold">
        Payment Date
    </label>

    <input
        type="date"
        name="date"
        class="form-control mb-3"
        required
    >


    <!-- SAVE -->

    <button
        type="submit"
        class="btn btn-success w-100"
    >

        <i class="bi bi-check-circle"></i>
        Save Fee

    </button>


</form>

</div>


<!-- SEARCH SCRIPT -->

<script>

const searchInput =
    document.getElementById("studentSearch");

const studentSelect =
    document.getElementById("studentSelect");

const allStudents = Array.from(
    studentSelect.querySelectorAll("option")
).slice(1);


searchInput.addEventListener("input", function () {

    const searchValue =
        this.value.toLowerCase().trim();

    studentSelect.innerHTML = "";

    const defaultOption =
        document.createElement("option");

    defaultOption.value = "";
    defaultOption.textContent =
        "Select Student";

    studentSelect.appendChild(defaultOption);


    allStudents.forEach(function(option) {

        const searchText =
            option.getAttribute("data-search")
                   .toLowerCase();

        if (searchText.includes(searchValue)) {

            studentSelect.appendChild(
                option.cloneNode(true)
            );

        }

    });

});

</script>


{% endblock %}
