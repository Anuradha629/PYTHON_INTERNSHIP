{% extends "base.html" %}

{% block content %}

<div class="container" style="max-width: 750px;">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-success text-white">

            <h3 class="mb-0">
                <i class="bi bi-person-plus-fill"></i>
                Add New Teacher
            </h3>

        </div>

        <div class="card-body" style="min-height: 430px; padding: 30px;">

            <form method="POST" action="/add_teacher">

                <!-- Teacher Name -->
                <div class="row">
                    <div class="col-md-12 mb-4">

                        <label class="form-label">
                            Teacher Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter Teacher Name"
                            required>

                    </div>
                </div>


                <!-- Subject -->
                <div class="row">
                    <div class="col-md-12 mb-4">

                        <label class="form-label">
                            Subject
                        </label>

                        <input
                            type="text"
                            name="subject"
                            class="form-control"
                            placeholder="Enter Subject"
                            required>

                    </div>
                </div>


                <!-- Mobile Number -->
                <div class="row">
                    <div class="col-md-12 mb-4">

                        <label class="form-label">
                            Mobile Number
                        </label>

                        <input
                            type="text"
                            name="mobile"
                            class="form-control"
                            placeholder="Enter Mobile Number"
                            maxlength="10"
                            required>

                    </div>
                </div>


                <!-- Teaching Timing -->
                <div class="row">
                    <div class="col-md-12 mb-4">

                        <label class="form-label">
                            Teaching Timing
                        </label>

                        <input
                            type="text"
                            name="timing"
                            class="form-control"
                            placeholder="Example: 10 AM - 12 PM"
                            required>

                    </div>
                </div>


                <!-- Experience -->
                <div class="row">
                    <div class="col-md-12 mb-4">

                        <label class="form-label">
                            Experience
                        </label>

                        <input
                            type="text"
                            name="experience"
                            class="form-control"
                            placeholder="Example: 5 Years"
                            required>

                    </div>
                </div>


                <hr class="my-4">


                <!-- Buttons -->
                <button type="submit" class="btn btn-success">

                    <i class="bi bi-check-circle-fill"></i>
                    Save Teacher

                </button>


                <a href="/teachers" class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
