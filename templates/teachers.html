{% extends "base.html" %}


{% block content %}


<div class="d-flex justify-content-between align-items-center mb-4">


    <h2 class="fw-bold">
        <i class="bi bi-person-badge-fill"></i>
        Teacher Management
    </h2>


    
    <a href="/add_teacher" class="btn btn-primary">

        <i class="bi bi-person-plus-fill"></i>
        Add Teacher
    </a>
   

    </a>


</div>




<div class="card shadow p-3">


<table class="table table-hover">


<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Subject</th>

<th>Mobile</th>
<th>Timing</th>

<th>Experience</th>

<th>Actions</th>


</tr>

</thead>



<tbody>


{% for t in teachers %}


<tr>


<td>
{{t.id}}
</td>


<td>
{{t.name}}
</td>


<td>
{{t.subject}}
</td>


<td>
{{t.mobile}}
</td>


<td>
{{t.timing}}
</td>


<td>
{{t.experience}}
</td>



<td>

<a href="/edit_teacher/{{t.id}}" class="btn btn-warning btn-sm">
    <i class="bi bi-pencil"></i>
</a>

<a href="/delete_teacher/{{t.id}}" class="btn btn-danger btn-sm"
   onclick="return confirm('Delete Teacher?')">
    <i class="bi bi-trash"></i>
</a>

</td>





</tr>


{% endfor %}



</tbody>


</table>


</div>



{% endblock %}
