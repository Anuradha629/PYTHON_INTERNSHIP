{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
<div class="card shadow border-0">
<div class="card-header bg-warning">
<h4 class="mb-0">
<i class="bi bi-pencil-square"></i>
Edit Attendance
</h4>
</div>

<div class="card-body">
<form method="POST">
<div class="mb-3">
<label class="fw-bold">
Date
</label>

<input type="date"
name="date"
value="{{record['date']}}"
class="form-control"
required>
</div>

<div class="mb-3">
<label class="fw-bold">
Status
</label>
<select name="status"
class="form-select">
<option value="Present"
{% if record['status']=="Present" %}selected{% endif %}>
Present
</option>

<option value="Absent"
{% if record['status']=="Absent" %}selected{% endif %}>
Absent
</option>
</select>


</div>
<button class="btn btn-success">
<i class="bi bi-save"></i>
Update Attendance
</button>


<a href="/attendance"
class="btn btn-secondary">
Cancel
</a>
</form>
</div>
</div>
</div>
{% endblock %}
