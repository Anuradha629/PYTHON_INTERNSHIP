{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6  col-md-5">

    <div class="card shadow-lg border-0">
        <div class="card-header bg-warning">
            <h3>
                <i class="bi bi-pencil-square"></i>
                Edit Teacher Information
            </h3>
        </div>


        <div class="card-body">
            <form method="POST">
    
                    <div class="mb-3">
                        <label class="form-label">
                            Teacher Name
                        </label>


                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{t.name}}"
                            required>
                    </div>


                    <div class=" mb-3">
                        <label class="form-label">
                            Subject
                        </label>


                        <input
                            type="text"
                            name="subject"
                            class="form-control"
                            value="{{t.subject}}"
                            required>

                    </div>
               


              
                    <div class=" mb-3">
                        <label class="form-label">
                            Mobile Number
                        </label>


                        <input
                            type="text"
                            name="mobile"
                            class="form-control"
                            value="{{t.mobile}}"
                            required>
                    </div>


                    <div class="mb-3">
                        <label class="form-label">
                            Teaching Timing
                        </label>


                        <input
                            type="text"
                            name="timing"
                            class="form-control"
                            value="{{t.timing}}"
                            required>
                    </div>
               

                
                    <div class=" mb-3">
                        <label class="form-label">
                            Experience

                        </label>


                        <input
                            type="text"
                            name="experience"
                            class="form-control"
                            value="{{t.experience}}"
                            required>
                    </div>
              


                <hr>
                <button class="btn btn-success">

                    <i class="bi bi-check-circle"></i>
                    Update Teacher
                </button>


                <a href="/teachers" class="btn btn-secondary">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
</div>
</div>
{% endblock %}
