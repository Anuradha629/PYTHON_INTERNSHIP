{% extends "base.html" %}

{% block content %}

<div class="container" style="max-width: 1000px;">

    <div class="card shadow-lg border-0">

        <!-- Header -->
        <div class="card-header bg-warning">
            <h3 class="mb-0">
                <i class="bi bi-pencil-square"></i>
                Edit Student Information
            </h3>
        </div>


        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                <!-- Row 1 -->
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Roll Number
                        </label>

                        <input
                            type="text"
                            name="roll_no"
                            class="form-control"
                            value="{{s.roll_no}}"
                            required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Student Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{s.name}}"
                            required>
                    </div>

                </div>


                <!-- Row 2 -->
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Father Name
                        </label>

                        <input
                            type="text"
                            name="father_name"
                            class="form-control"
                            value="{{s.father_name}}"
                            required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Surname
                        </label>

                        <input
                            type="text"
                            name="surname"
                            class="form-control"
                            value="{{s.surname}}"
                            required>
                    </div>

                </div>


                <!-- Row 3 -->
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Mobile Number
                        </label>

                        <input
                            type="text"
                            name="mobile"
                            class="form-control"
                            value="{{s.mobile}}"
                            required>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Course
                        </label>

                        <input
                            type="text"
                            name="course"
                            class="form-control"
                            value="{{s.course}}"
                            required>
                    </div>

                </div>


                <!-- Row 4 -->
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Batch
                        </label>

                        <select name="batch" class="form-select">

                            <option value="Morning"
                                {% if s.batch=="Morning" %}selected{% endif %}>
                                Morning
                            </option>

                            <option value="Afternoon"
                                {% if s.batch=="Afternoon" %}selected{% endif %}>
                                Afternoon
                            </option>

                            <option value="Evening"
                                {% if s.batch=="Evening" %}selected{% endif %}>
                                Evening
                            </option>

                        </select>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Admission Date
                        </label>

                        <input
                            type="date"
                            name="admission_date"
                            class="form-control"
                            value="{{s.admission_date}}">
                    </div>

                </div>


                <!-- Row 5 -->
                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="3">{{s.address}}</textarea>
                    </div>


                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Status
                        </label>

                        <select name="status" class="form-select">

                            <option value="Active"
                                {% if s.status=="Active" %}selected{% endif %}>
                                Active
                            </option>

                            <option value="Inactive"
                                {% if s.status=="Inactive" %}selected{% endif %}>
                                Inactive
                            </option>

                        </select>
                    </div>

                </div>
                <!-- Student Photo -->

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            <i class="bi bi-camera-fill"></i>
                            Student Photo
                        </label>

                        {% if s.photo and s.photo != "default.png" %}

                            <div class="mb-2">
                                <img
                                    src="{{ url_for('static', filename='uploads/' + s.photo) }}"
                                    alt="Student Photo"
                                    width="100"
                                    height="120"
                                    style="object-fit: cover; border-radius: 8px; border: 2px solid #ddd;">
                            </div>

                        {% endif %}

                        <input
                            type="file"
                            name="photo"
                            class="form-control"
                            accept=".jpg,.jpeg,.png">

                        <small class="text-muted">
                            Upload JPG, JPEG or PNG image
                        </small>

                    </div>

                </div>


                <!-- Buttons -->
                <div class="mt-2">

                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-circle"></i>
                        Update Student
                    </button>

                    <a href="/students" class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
